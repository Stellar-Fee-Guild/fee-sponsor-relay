services:
  relay:
    build: .
    image: fee-sponsor-relay:local
    ports:
      - '3000:3000'
    environment:
      HORIZON_URL: ${HORIZON_URL:-https://horizon-testnet.stellar.org}
      NETWORK_PASSPHRASE: ${NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Prefer mounting the secret as a file (see the `secrets/` volume
      # below) over passing SPONSOR_SECRET_KEY directly as an env var.
      SPONSOR_SECRET_KEY_FILE: /run/secrets/sponsor_secret_key
      POLICY_ALLOWLIST: ${POLICY_ALLOWLIST:-}
      POLICY_DENYLIST: ${POLICY_DENYLIST:-}
      POLICY_MAX_FEE_STROOPS_PER_TX: ${POLICY_MAX_FEE_STROOPS_PER_TX:-1000000}
      POLICY_HOURLY_CAP_STROOPS_PER_ACCOUNT: ${POLICY_HOURLY_CAP_STROOPS_PER_ACCOUNT:-5000000}
      POLICY_DAILY_CAP_STROOPS_PER_ACCOUNT: ${POLICY_DAILY_CAP_STROOPS_PER_ACCOUNT:-20000000}
      POLICY_MAX_TX_VALIDITY_SECONDS: ${POLICY_MAX_TX_VALIDITY_SECONDS:-300}
      RATE_LIMIT_PER_ACCOUNT_PER_MINUTE: ${RATE_LIMIT_PER_ACCOUNT_PER_MINUTE:-10}
      RATE_LIMIT_PER_IP_PER_MINUTE: ${RATE_LIMIT_PER_IP_PER_MINUTE:-30}
    volumes:
      - ./secrets/sponsor_secret_key:/run/secrets/sponsor_secret_key:ro
    restart: unless-stopped
